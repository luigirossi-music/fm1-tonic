<rect x="15" y="325" width="970" height="160" rx="16" fill="#ffffff" stroke="#9aa1a9" stroke-width="1.5"/>
<text x="30" y="344" font-size="12" font-weight="700" fill="#5b626a">THE WHOLE MACHINE</text>
<rect x="40" y="355" width="130" height="58" rx="10" fill="#e9edf5" stroke="#5d86d6" stroke-width="2"/>
<text x="105.0" y="389.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1f23">8 TRACKS</text>
<rect x="200" y="355" width="150" height="58" rx="10" fill="#e9edf5" stroke="#5d86d6" stroke-width="2"/>
<text x="275.0" y="380.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1f23">SIDECHAIN</text>
<text x="275.0" y="398.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3a4a6a">HOME 2nd press</text>
