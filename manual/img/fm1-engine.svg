<path d="M420 250 H505 V208" fill="none" stroke="#2146c8" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M560 179 H585" fill="none" stroke="#2146c8" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M675 179 H700" fill="none" stroke="#2146c8" stroke-width="2.5" marker-end="url(#a)"/>
