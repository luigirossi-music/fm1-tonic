<text x="890.0" y="175.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1f23">CUTS, LEVEL, PAN</text>
<text x="890.0" y="193.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3a4a6a">HOME</text>
<rect x="250" y="48" width="380" height="56" rx="10" fill="#fff" stroke="#9aa1a9" stroke-width="2" stroke-dasharray="5 4"/>
