<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="The FM1 Tonic engine: each of the 8 tracks has a pitch modulator and oscillator, a noise filter and noise envelope, a mix, a distortion and an EQ, then low cut, high cut, level and pan; the 8 tracks go through the sidechain, the master low cut and the compressor to the master volume, with reverb and delay as send effects" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2146c8"/></marker></defs>
<rect x="2" y="2" width="996" height="496" rx="22" fill="#f4f5f6" stroke="#9aa1a9" stroke-width="2"/>
<rect x="15" y="15" width="970" height="290" rx="16" fill="#ffffff" stroke="#9aa1a9" stroke-width="1.5"/>
<text x="30" y="34" font-size="12" font-weight="700" fill="#5b626a">ONE VOICE, TRACKS 1-8 (the small word in each box = the button that opens its page)</text>
<rect x="40" y="48" width="170" height="56" rx="10" fill="#e9edf5" stroke="#5d86d6" stroke-width="2"/>
<text x="125.0" y="72.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1f23">PITCH MOD</text>
<text x="125.0" y="90.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3a4a6a">SEL</text>
<rect x="40" y="128" width="170" height="56" rx="10" fill="#e9edf5" stroke="#5d86d6" stroke-width="2"/>
<text x="125.0" y="152.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1f23">OSCILLATOR</text>
<text x="125.0" y="170.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3a4a6a">ENV</text>
<rect x="40" y="222" width="170" height="56" rx="10" fill="#e9edf5" stroke="#5d86d6" stroke-width="2"/>
<text x="125.0" y="246.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1f23">NOISE FILTER</text>
<text x="125.0" y="264.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3a4a6a">LFO</text>
<rect x="250" y="222" width="170" height="56" rx="10" fill="#e9edf5" stroke="#5d86d6" stroke-width="2"/>
<text x="335.0" y="246.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1f23">NOISE ENVELOPE</text>
<text x="335.0" y="264.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3a4a6a">EDIT (K2 = CHOKE)</text>
<rect x="450" y="150" width="110" height="58" rx="10" fill="#e9edf5" stroke="#5d86d6" stroke-width="2"/>
<text x="505.0" y="175.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1f23">MIX</text>
<text x="505.0" y="193.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3a4a6a">FX</text>
<rect x="585" y="150" width="90" height="58" rx="10" fill="#e9edf5" stroke="#5d86d6" stroke-width="2"/>
<text x="630.0" y="175.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1f23">DIST</text>
<text x="630.0" y="193.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3a4a6a">FX</text>
<rect x="700" y="150" width="90" height="58" rx="10" fill="#e9edf5" stroke="#5d86d6" stroke-width="2"/>
<text x="745.0" y="175.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1f23">EQ</text>
<text x="745.0" y="193.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3a4a6a">FX</text>
