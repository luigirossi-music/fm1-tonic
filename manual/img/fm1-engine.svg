<text x="635.0" y="398.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3a4a6a">GLO 3rd press</text>
<rect x="740" y="355" width="150" height="58" rx="10" fill="#e9edf5" stroke="#5d86d6" stroke-width="2"/>
<text x="815.0" y="380.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1f23">VOLUME</text>
<text x="815.0" y="398.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3a4a6a">MASTER knob</text>
<path d="M170 384 H200" fill="none" stroke="#2146c8" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M350 384 H380" fill="none" stroke="#2146c8" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M530 384 H560" fill="none" stroke="#2146c8" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M710 384 H740" fill="none" stroke="#2146c8" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="200" y="430" width="235" height="46" rx="10" fill="#eef6ec" stroke="#4fae3a" stroke-width="2"/>
<text x="317.5" y="449.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1f23">REVERB + DELAY</text>
<text x="317.5" y="467.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3a4a6a">FX hold / HOME hold</text>
<path d="M105 413 V453 H200" fill="none" stroke="#2146c8" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M435 453 H455 V413" fill="none" stroke="#2146c8" stroke-width="2.5" marker-end="url(#a)"/>
<text x="470" y="448" font-size="11.5" font-weight="600" fill="#3a4a6a">fed by each track's SENDS (HOME 2nd press)</text>
<text x="470" y="464" font-size="11.5" font-weight="600" fill="#3a4a6a">and by PERFORM dry / wet (FX 2nd press)</text>
